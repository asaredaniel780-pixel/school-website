<!DOCTYPE html>
<html>
    <head>
        <title>Admission</title>
        <link rel="stylesheet" type="text/css" a href="css.css">
    </head>
    <body>
        <section id="container">
        <h1>ADMISSION PORTAL</h1>

        <section id="pd">
            <div id="personal">
                Personal Details
            </div>

            <div class="aa">
                <label>First Name</label>
                <input type="textbox" class="ll"
                placeholder="FirstName"
                maxlength="12"
                required><br>

                <label>Last Name</label>
                <input type="textbox" class="ll"
                placeholder="LastName"
                maxlength="12"
                required><br>

                <label>Date of Birth</label>
                <input type="date" class="ll"
                required><br>

                <label>Email</label>
                <input type="email" class="ll"
                placeholder="a@gmail.com"
                maxlength="12"
                required><br>

                <label>Residentail Adress</label>
                <input type="textbox" class="ll"
                placeholder="Residentail Address"
                maxlength="12"
                required><br>

                <label>Religion</label>
                <input type="textbox" class="ll"
                placeholder="Christian"
                maxlength="12"
                required><br>

                <label>Gender</label><select class="ll">
                    <option Value>Male</option>
                    <option Value>Female</option>
                    <option Value>Other</option>
                </select>
            </div>
        </section>

        <section class="aca">
            <div id="bb">
                Academic Details
            </div>
            <div class="acd">
                <label >Select Course</label>
                <select class="ll">
                    <option value>Bsc. Information Technology</option>
                    <option value>Bsc. Computer Science</option>
                    <option value>Bsc. Cyber Security</option>
                    <option value>Bsc. Software Engineering</option>
                </select><br>

                <label>Choose Session</label><br>
                <label>Regular</label>
                <input type="checkbox">

                <label>Evening</label>
                <input type="checkbox">
                
                <label>Weekend</label>
                <input type="checkbox">

                <label>Online</label>
                <input type="checkbox"><br>


                <Label>Name of SHS</Label>
                <input type="textbox" class="ll"
                placeholder="Enter name of SHS"
                maxlength="25"
                required><br>

                <label>Examination Type</label><br>
                Degree
                <input type="radio"><br>

                WASSCE
                <input type="radio"><br>

                BECE
                <input type="radio"><br>
            </div>
        </section>

        <section id="par">
            <div class="ccc">
                Parents Details
            </div>
            <div class="ddd">
                <label>Father's Name</label>
                <input type="textbox" class="ll"
                placeholder="Father's Name"
                maxlength="12"
                required><br>

                <label>Telephone Number</label>
                <input type="text" class="ll"
                placeholder="Telephone"
                maxlength="12"><br
                required>

                <label>Mother's Name</label>
                <input type="textbox" class="ll"
                placeholder="Father's Name"
                maxlength="12"
                required><br>

                <label>Telephone Number</label>
                <input type="text" class="ll"
                placeholder="Tel"
                maxlength="12"><br>

            <label>Residentail Address</label>
            <input type="text" class="ll"
            placeholder="Residentail Address"
            required>
            </div>

        </section>

        <div class="button-container">
            <button type="submit">Submit</button>
           
 </section>
</body>
</html>
